name: Actualizar Feed y Generar Imagenes

on:
  # 1. Ponemos Schedule primero (como en tu archivo antiguo)
  schedule:
    # HORAS UTC: 02,05,08... EQUIVALEN A TUS HORAS PERÚ (9PM, 12AM, 3AM...)
    # Esta sintaxis de una sola línea es más segura y no falla.
    - cron: '7 2,5,8,11,14,17,20,23 * * *'
  
  # 2. Agregamos esto para FORZAR que se registre el cambio apenas guardes
  push:
    branches: [ "main" ]
    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Script por Lotes
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          # 1. Configurar Git
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          
          # 2. Pull preventivo
          git pull origin main || true
          
          # 3. Ejecutar
          python main.py
