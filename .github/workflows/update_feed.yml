name: Actualizar Feed y Generar Imagenes

on:
  workflow_dispatch:
  schedule:
    # Ejecutar cada 3 horas (o a las horas que prefieras)
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 2 horas de seguridad
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # OPTIMIZACIÓN: Cachear pip para que no instale todo de cero cada vez
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Script Turbo (50 Hilos)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python main.py

      - name: Commit y Push de nuevas imágenes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add images/
          # Hacemos commit si hay cambios. Si son demasiados archivos, git puede quejarse,
          # pero normalmente aguanta bien.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Nuevas imagenes generadas" && git push)