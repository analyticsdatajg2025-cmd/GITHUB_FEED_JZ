name: Actualizar Feed y Generar Imagenes

on:
  workflow_dispatch:
  schedule:
    # Ejecutar cada 3 horas (00:00, 03:00, 06:00...)
    - cron: '0 */3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Mantenemos 3h de margen total de seguridad
    permissions:
      contents: write
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # <--- ESTO ACTIVA EL CACHÉ DE LIBRERÍAS

      - name: Instalar dependencias
        # El sistema revisará si ya existe cache. Si no, instala.
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Script de Procesamiento Inteligente
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python main.py

      - name: Commit y Push de nuevas imágenes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add images/
          # Commit solo si hay cambios reales
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Lote incremental de imagenes" && git push)